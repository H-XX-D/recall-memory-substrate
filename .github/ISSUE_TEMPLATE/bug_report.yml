name: "🐞 Bug report"
description: Something in Recall isn't behaving as documented.
title: "[bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a clear report. Please **do not include
        real secrets, credentials, or production memory databases** — use a minimal
        reproduction.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: "`recall compile` returned an empty packet when…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Ideally the exact commands or a minimal proposal JSON.
      placeholder: |
        1. recall init
        2. recall admit --json proposal.json
        3. recall compile "…"
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Recall version / commit
      placeholder: "0.2.0 or commit sha"
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Which surface?
      multiple: true
      options:
        - CLI
        - TUI
        - MCP server
        - Daemon
        - Admission / firewall
        - Context compiler
        - Semantic search
        - Secrets side graph
        - Other
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Node version (`node -v`), install method.
      placeholder: "macOS 15 · Node 24.3 · npm install -g github:…"
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Redact anything sensitive.
      render: shell
