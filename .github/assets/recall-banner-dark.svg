<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Recall: push memory for AI agents">
  <title>Recall: push memory for AI agents</title>
  <defs>
    <linearGradient id="bd-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <radialGradient id="bd-glow" cx="0.78" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#0d9488" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
    <pattern id="bd-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="20" fill="#0a0e14"/>
  <rect width="1280" height="360" rx="20" fill="url(#bd-grid)" opacity="0.5"/>
  <rect width="1280" height="360" rx="20" fill="url(#bd-glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="359" rx="19.5" fill="none" stroke="#1e293b"/>

  <!-- mark -->
  <g transform="translate(96, 116) scale(1.1)">
    <path d="M60 18 L96 39 V81 L60 102 L24 81 V39 Z" fill="none" stroke="url(#bd-accent)" stroke-width="5" stroke-linejoin="round" opacity="0.45"/>
    <g stroke="url(#bd-accent)" stroke-width="4" stroke-linecap="round">
      <line x1="60" y1="44" x2="42" y2="74"/>
      <line x1="60" y1="44" x2="78" y2="74"/>
      <line x1="42" y1="74" x2="78" y2="74"/>
    </g>
    <circle cx="60" cy="44" r="10" fill="url(#bd-accent)"/>
    <circle cx="42" cy="74" r="9" fill="#0d9488"/>
    <circle cx="78" cy="74" r="9" fill="#2dd4bf"/>
  </g>

  <!-- wordmark + tagline -->
  <text x="244" y="170" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="84" font-weight="700" letter-spacing="-2" fill="#f1f5f9">recall</text>
  <rect x="248" y="196" width="64" height="4" rx="2" fill="url(#bd-accent)"/>
  <text x="324" y="200" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="22" font-weight="500" fill="#5eead4">v0.2.0</text>
  <text x="248" y="244" font-family="-apple-system, 'Segoe UI', Inter, system-ui, sans-serif" font-size="27" font-weight="400" fill="#94a3b8">Push memory for AI agents.</text>
  <text x="248" y="282" font-family="-apple-system, 'Segoe UI', Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#64748b">Checks before it acts &#183; supersedes on its own &#183; local &amp; yours</text>

  <!-- constellation -->
  <g transform="translate(880, 60)" opacity="0.95">
    <g stroke="#334155" stroke-width="1.5">
      <line x1="70" y1="70" x2="180" y2="40"/>
      <line x1="70" y1="70" x2="120" y2="170"/>
      <line x1="180" y1="40" x2="250" y2="120"/>
      <line x1="120" y1="170" x2="250" y2="120"/>
      <line x1="250" y1="120" x2="320" y2="60"/>
      <line x1="180" y1="40" x2="320" y2="60"/>
      <line x1="120" y1="170" x2="210" y2="210"/>
      <line x1="250" y1="120" x2="210" y2="210"/>
    </g>
    <!-- hyperedge region -->
    <path d="M180 40 L250 120 L120 170 Z" fill="url(#bd-accent)" opacity="0.10" stroke="url(#bd-accent)" stroke-width="1.5" stroke-opacity="0.4" stroke-linejoin="round"/>
    <g>
      <circle cx="70" cy="70" r="8" fill="#475569"/>
      <circle cx="180" cy="40" r="11" fill="#2dd4bf"/>
      <circle cx="120" cy="170" r="10" fill="#0d9488"/>
      <circle cx="250" cy="120" r="13" fill="#5eead4"/>
      <circle cx="320" cy="60" r="8" fill="#475569"/>
      <circle cx="210" cy="210" r="8" fill="#475569"/>
    </g>
  </g>
</svg>
